# Ставится в /etc/nginx/snippets/nikitosfrolov/balcony.conf. Сайт nikitosfrolov.ru
# подключает всю папку строкой include snippets/nikitosfrolov/*.conf;
# Это делает ./deploy.sh --nginx.
#
# Префикс НЕ срезаем: сервер знает про него сам (BASE_PATH=/balcony),
# поэтому proxy_pass без завершающего слэша. ESP сюда не ходит — у неё свой порт 82.

location /balcony/ {
    proxy_pass http://127.0.0.1:3600;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# WebSocket браузеров. Отдельный location, чтобы не заводить map в http-контексте сайта.
location = /balcony/ws {
    proxy_pass http://127.0.0.1:3600;
    proxy_http_version 1.1;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        "upgrade";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
}

location = /balcony {
    return 301 /balcony/;
}
